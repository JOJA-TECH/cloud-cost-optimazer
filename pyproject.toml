[project]
name = "cco-forecasting"
version = "0.1.0"
description = "Experimental forecasting pipeline for the observed Azure SQL resource (cco_data context)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "ruff>=0.17.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
forecasting = "forecasting.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
