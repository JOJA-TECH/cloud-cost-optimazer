[project]
name = "cco-collector"
version = "0.1.0"
description = "Cloud Cost Optimizer collector: workload, metrics and sync on an Azure VM"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-dotenv==1.0.*",
    "psycopg2-binary==2.9.*",
    "pyodbc==5.*",
    "azure-identity==1.*",
    "azure-monitor-query==1.*",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]